[workspace]
members = ["crates/ledger-core", "crates/ledger-replica", "crates/ledger-node", "crates/ledger-recovery", "crates/ledger-api", "crates/ledger-export", "crates/ledger-export-adapters"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.lints.rust]
unsafe_code = "forbid"

# Keep the native RocksDB debug build practical on development machines.
[profile.dev.package.librocksdb-sys]
debug = false
