syntax = "proto3";

package ledger.v1;

// All requests target one ledger. Account numbers refer to that ledger.
// IDs and unsigned quantities encoded as strings use canonical decimal u128.
// Signed balances permit a single leading minus for a nonzero magnitude.
// Repeated inputs preserve client order and allow up to 1024 items per field.
service Ledger {
  rpc CreateAccount(CreateAccountRequest) returns (Decision);
  rpc SetAccountBounds(SetAccountBoundsRequest) returns (Decision);
  rpc PostEntry(PostEntryRequest) returns (Decision);
  rpc ReserveEntry(ReserveEntryRequest) returns (Decision);
  rpc CaptureReservation(CaptureReservationRequest) returns (Decision);
  rpc VoidReservation(VoidReservationRequest) returns (Decision);
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  rpc GetReservation(GetReservationRequest) returns (GetReservationResponse);
  rpc GetEntry(GetEntryRequest) returns (GetEntryResponse);
  rpc GetRequestOutcome(GetRequestOutcomeRequest) returns (GetRequestOutcomeResponse);
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_DEBIT = 1;
  SIDE_CREDIT = 2;
}
message Empty {}
message Bounds {
  optional string min = 1;
  optional string max = 2;
}
message Line {
  string account_id = 1;
  Side side = 2;
  string amount = 3;
}
message ExplicitFunding { repeated Line lines = 1; }
message Source {
  string account_id = 1;
  oneof floor {
    Empty configured = 2;
    string at = 3;
  }
  optional string cap = 4;
}
enum Shortfall {
  SHORTFALL_UNSPECIFIED = 0;
  SHORTFALL_REQUIRE_FULL = 1;
}
message Waterfall {
  string amount = 1;
  repeated Source sources = 2;
  repeated Line destinations = 3;
  Shortfall shortfall = 4;
}
message Funding {
  oneof kind {
    ExplicitFunding explicit = 1;
    Waterfall waterfall = 2;
  }
}
message AvailableAtLeast {
  string account_id = 1;
  string amount = 2;
}
message Condition {
  oneof kind { AvailableAtLeast available_at_least = 1; }
}
message Allocation {
  uint32 line = 1; // zero-based original reservation line
  string amount = 2;
}
message Allocations { repeated Allocation lines = 1; }

message CreateAccountRequest {
  string ledger_id = 1;
  string request_id = 2;
  string account_id = 3;
  uint32 code = 4; // 0 through 65535
  Side normal = 5;
  Bounds bounds = 6; // omitted means unbounded
}
message SetAccountBoundsRequest {
  string ledger_id = 1;
  string request_id = 2;
  string account_id = 3;
  Bounds bounds = 4; // replace the entire policy; an empty Bounds clears both limits
}
message PostEntryRequest {
  string ledger_id = 1;
  string request_id = 2;
  Funding funding = 3;
  repeated Condition conditions = 4;
  optional uint64 corrects = 5;
}
message ReserveEntryRequest {
  string ledger_id = 1;
  string request_id = 2;
  string reservation_id = 3;
  Funding funding = 4;
  repeated Condition conditions = 5;
}
message CaptureReservationRequest {
  string ledger_id = 1;
  string request_id = 2;
  string reservation_id = 3;
  oneof capture {
    Empty full = 4;
    string amount = 5;
    Allocations allocations = 6;
  }
  // Omit for full capture. Both omission and require_full_capture cause a
  // recorded MissingDisposition if the capture leaves a remainder.
  oneof disposition {
    Empty require_full_capture = 7;
    Empty keep_reserved = 8;
    Empty release = 9;
  }
}
message VoidReservationRequest {
  string ledger_id = 1;
  string request_id = 2;
  string reservation_id = 3;
}
message GetAccountRequest {
  string ledger_id = 1;
  string account_id = 2;
}
message GetEntryRequest {
  string ledger_id = 1;
  uint64 entry_id = 2;
}
message GetRequestOutcomeRequest {
  string ledger_id = 1;
  string request_id = 2;
}

message Counters {
  string debits_posted = 1;
  string credits_posted = 2;
  string debits_pending = 3;
  string credits_pending = 4;
}
message Account {
  string ledger_id = 1;
  string account_id = 2;
  uint32 code = 3;
  Side normal = 4;
  Bounds bounds = 5;
  Counters counters = 6;
  string posted_balance = 7;
  string available_balance = 8;
}
message JournalEntry {
  uint64 entry_id = 1;
  repeated Line lines = 2;
  optional uint64 corrects = 3;
}
message Reserved {
  string reservation_id = 1;
  repeated Line lines = 2;
}
message Captured {
  string reservation_id = 1;
  JournalEntry entry = 2;
}
message Outcome {
  oneof kind {
    string account_created = 1;
    string bounds_changed = 2;
    JournalEntry posted = 3;
    Reserved reserved = 4;
    Captured captured = 5;
    string voided = 6;
  }
}
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_ID_CONFLICT = 1;
  ERROR_CODE_WRONG_LEDGER = 2;
  ERROR_CODE_UNKNOWN_ACCOUNT = 3;
  ERROR_CODE_DUPLICATE_ACCOUNT = 4;
  ERROR_CODE_INVALID_BOUNDS = 5;
  ERROR_CODE_COUNTER_OVERFLOW = 6;
  ERROR_CODE_BELOW_MINIMUM = 7;
  ERROR_CODE_ABOVE_MAXIMUM = 8;
  ERROR_CODE_INVALID_CONDITION_TARGET = 9;
  ERROR_CODE_CONDITION_FAILED = 10;
  ERROR_CODE_UNBALANCED = 11;
  ERROR_CODE_ZERO_AMOUNT = 12;
  ERROR_CODE_TOO_FEW_LINES = 13;
  ERROR_CODE_INVALID_WATERFALL = 14;
  ERROR_CODE_DUPLICATE_SOURCE = 15;
  ERROR_CODE_MISSING_FLOOR = 16;
  ERROR_CODE_INSUFFICIENT_FUNDING = 17;
  ERROR_CODE_UNKNOWN_ENTRY = 18;
  ERROR_CODE_DUPLICATE_RESERVATION = 19;
  ERROR_CODE_UNKNOWN_RESERVATION = 20;
  ERROR_CODE_CLOSED_RESERVATION = 21;
  ERROR_CODE_INVALID_CAPTURE = 22;
  ERROR_CODE_MISSING_DISPOSITION = 23;
  ERROR_CODE_EXCESS_CAPTURE = 24;
  ERROR_CODE_DUPLICATE_ALLOCATION = 25;
}
message AccountRef {
  string ledger_id = 1;
  string account_id = 2;
}
message Rejection {
  ErrorCode code = 1;
  oneof context {
    AccountRef account = 2;
    string request_id = 3;
    uint64 entry_id = 4;
    string reservation_id = 5;
    uint32 line = 6;
  }
}
message Decision {
  oneof result {
    Outcome accepted = 1;
    Rejection rejected = 2;
  }
}
message GetAccountResponse { Account account = 1; }
message GetEntryResponse { JournalEntry entry = 1; }
message GetRequestOutcomeResponse { Decision decision = 1; }

// This local operational read is available on each voter and the learner's
// optional monitor listener. Query each member directly when comparing cuts.
service Monitor {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}
message GetReservationRequest {
  string ledger_id = 1;
  string reservation_id = 2;
}
enum ReservationStatus {
  RESERVATION_STATUS_UNSPECIFIED = 0;
  RESERVATION_STATUS_OPEN = 1;
  RESERVATION_STATUS_CAPTURED = 2;
  RESERVATION_STATUS_VOIDED = 3;
}
message Reservation {
  string reservation_id = 1;
  ReservationStatus status = 2;
  repeated Line lines = 3; // Original allocation order and amounts.
  repeated string remaining = 4; // One current amount per original line, including zeroes.
}
message GetReservationResponse { Reservation reservation = 1; }

message GetStatusRequest { string ledger_id = 1; }
enum ServingMode {
  SERVING_MODE_UNSPECIFIED = 0;
  SERVING_MODE_PROTECTED_VOTER = 1;
  SERVING_MODE_QUORUM_VOTER = 2;
  SERVING_MODE_LEARNER = 3;
  SERVING_MODE_DIAGNOSTIC_VOTER = 4;
}
message PeerProgress {
  uint64 node_id = 1;
  bool learner = 2;
  uint64 matched_index = 3;
}
message ExportProgress {
  optional uint64 saved_archive_index = 1;
  optional uint64 verified_archive_index = 2;
  optional uint64 archive_lag_entries = 3;
  optional uint64 event_index = 4;
  optional uint32 event_slot = 5; // 65535 means all slots through this entry were scanned.
  optional uint64 event_lag_entries = 6; // Includes a partially scanned entry.
  optional string archive_error = 7;
  optional string event_error = 8;
}
message GetStatusResponse {
  string ledger_id = 1;
  string generation = 2;
  uint64 node_id = 3;
  ServingMode mode = 4;
  bool is_leader = 5;
  optional uint64 leader_id = 6;
  uint64 term = 7;
  uint64 applied_index = 8;
  optional uint64 checkpoint_index = 9;
  optional uint64 verified_journal_index = 10;
  optional string protection_error = 11;
  optional string checkpoint_error = 12;
  repeated PeerProgress peers = 13; // Leader's local Raft match observations.
  ExportProgress exports = 14; // Present only at the learner.
  optional string snapshot_maintenance_error = 15;
}
