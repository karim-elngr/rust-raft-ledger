[package]
name = "ledger-replica"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
ledger-export = { path = "../ledger-export" }
ledger-core = { path = "../ledger-core", features = ["projection-serde"] }
ledger-recovery = { path = "../ledger-recovery" }
bincode = "1.3.3"
protobuf = "2.28"
raft = { version = "0.7.0", default-features = false, features = ["protobuf-codec"] }
rocksdb = { version = "0.24.0", default-features = false, features = ["bindgen-runtime"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
slog = "2"
thiserror = "2"

tempfile = "3"

[lints]
workspace = true
